<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- `?v=2` nos ícones: o arte mudou mas os NOMES dos arquivos são fixos
         (gerados por `scripts/gerarIconesPwa.cjs`), e navegador/SO cacheiam
         favicon e ícone de PWA instalado de forma agressiva — sem o parâmetro,
         quem já usa continuaria vendo a logo antiga por tempo indeterminado.
         Subir esse número junto com qualquer troca de arte (mesmo valor aqui e
         em `public/manifest.webmanifest`). -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png?v=2" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>CARTEIRA 2D</title>
    <script>
      // Aplica o tema salvo antes do 1º paint (evita flash). Padrão: escuro.
      (function () {
        try {
          var t = localStorage.getItem('tema');
          document.documentElement.dataset.theme = t === 'claro' ? 'light' : 'dark';
        } catch (e) { document.documentElement.dataset.theme = 'dark'; }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
