  <!-- Logotipo 2D Consultores: placa preta arredondada + seta ascendente branca.
       Vetorizado de logo_2d_icone.png. O path do potrace era um unico caminho
       preto com a seta como FURO (transparente); aqui esta separado em placa +
       seta para a seta ser branca de fato, e nao herdar o fundo atras do icone
